<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告設定面板 V1.10 geminiPro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 左側控制面板開始 -->
        <div class="control-panel">
            <h2>公告設定面板 V1.10 geminiPro</h2>
            
            <div class="form-group">
                <label>公告類別 (標題後綴)</label>
                <select id="doc-type">
                    <option value="公告">一般公告</option>
                    <option value="緊急公告">緊急公告</option>
                    <option value="提醒公告">提醒公告</option>
                </select>
            </div>

            <div class="form-group">
                <label>簡要標題 <span class="hint" id="title-hint">(最多 15 字)</span></label>
                <select id="doc-title-select" style="margin-bottom: 8px;"></select>
                <input type="text" id="doc-title-custom" placeholder="請由上方選擇或在此直接輸入/修改標題..." maxlength="15">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>公告日期</label>
                    <input type="date" id="start-date">
                </div>
                <div class="form-group">
                    <label>截止日期</label>
                    <input type="date" id="end-date">
                </div>
            </div>

            <div class="form-group">
                <label>公告字號</label>
                <!-- 已經由 JS 鎖定反灰，由後台自動生成 -->
                <input type="text" id="doc-serial" placeholder="載入中...">
            </div>

            <hr>

            <h3 style="color: var(--primary-color); margin-bottom: 10px;">📄 核心內容設定區</h3>
            
            <div class="smart-item-group">
                <label class="group-title"><input type="checkbox" id="chk-p1" checked> 1. 依據與緣由</label>
                <div class="sub-items" id="sub-p1">
                    <label><input type="checkbox" id="chk-p1-1"> 本社區規約 第 <input type="text" id="p1-1-v1" class="inline-input short"> 條 <input type="text" id="p1-1-v2" class="inline-input long" placeholder="內容說明..."></label>
                    <label><input type="checkbox" id="chk-p1-2"> 本社區 <input type="text" id="p1-2-v1" class="inline-input medium"> 管理辦法第 <input type="text" id="p1-2-v2" class="inline-input short"> 條 <input type="text" id="p1-2-v3" class="inline-input long" placeholder="內容說明..."></label>
                    <label><input type="checkbox" id="chk-p1-3"> 第 <input type="text" id="p1-3-v1" class="inline-input short"> 屆第 <input type="text" id="p1-3-v2" class="inline-input short"> 次區權會 <input type="text" id="p1-3-v3" class="inline-input medium"> 決議辦理</label>
                    <label><input type="checkbox" id="chk-p1-4"> 第 <input type="text" id="p1-4-v1" class="inline-input short"> 屆第 <input type="text" id="p1-4-v2" class="inline-input short"> 次管委會 <input type="text" id="p1-4-v3" class="inline-input medium"> 決議辦理</label>
                    <label><input type="checkbox" id="chk-p1-5"> 主管機關 <input type="text" id="p1-5-v1" class="inline-input long"> 函文辦理</label>
                    <label><input type="checkbox" id="chk-p1-custom"> 自訂補充依據：<input type="text" id="p1-custom-v1" class="inline-input long" placeholder="請自行輸入依據或緣由說明..."></label>
                </div>
            </div>

            <div class="smart-item-group">
                <label class="group-title"><input type="checkbox" id="chk-p2" checked> 2. 執行時間與地點</label>
                <div class="sub-items" id="sub-p2">
                    <div style="margin-bottom: 5px;">日期時間：<input type="text" id="p2-time" class="inline-input long" placeholder="例如：113年5月1日 09:00-12:00"></div>
                    <div>執行地點：<input type="text" id="p2-loc" class="inline-input long" placeholder="例如：各棟頂樓與地下室"></div>
                </div>
            </div>

            <div class="smart-item-group">
                <label class="group-title"><input type="checkbox" id="chk-p3" checked> 3. 作業細節</label>
                <div class="sub-items" id="sub-p3">
                    <select id="p3-cat" style="margin-bottom: 5px;">
                        <option value="">請選擇細節主類別...</option>
                        <option value="行政/車位類">【行政/車位類】</option>
                        <option value="維修/施工類">【維修/施工類】</option>
                        <option value="宣導/違規類">【宣導/違規類】</option>
                    </select>
                    
                    <select id="p3-template" style="margin-bottom: 8px; display: none;">
                        <option value="">-- 請選擇範本內容 (可留空自打) --</option>
                    </select>

                    <div class="editor-toolbar">
                        <select id="btn-fontsize" title="文字大小" class="editor-select">
                            <option value="">大小</option>
                            <option value="0.8em">小字</option>
                            <option value="1em">標準</option>
                            <option value="1.25em">中大</option>
                            <option value="1.5em">特大</option>
                        </select>
                        <button type="button" id="btn-bold" title="粗體"><b>B</b></button>
                        <button type="button" id="btn-red" title="紅字" style="color: #cc0000;"><b>A</b></button>
                        <span class="hint" style="margin-left: auto; font-size: 11px;">選取文字後操作</span>
                    </div>
                    <div id="p3-editor" contenteditable="true" placeholder="請填寫作業細節說明，可使用上方工具標示粗體、紅字或放大縮小..."></div>
                </div>
            </div>

            <hr>

            <h3 style="color: var(--primary-color); margin-bottom: 10px;">🔔 提醒與附件區</h3>
            
            <!-- 【整合後的附件上傳區塊】 -->
            <div class="form-group" style="background: #fff; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px;">
                <label>📁 上傳附件 (圖片/PDF) - <span style="color: var(--primary-color);">將直接合併於底圖</span></label>
                <input type="file" id="attachment-input" accept="image/*,application/pdf">
                <p class="hint" style="margin: 4px 0 12px 0;">單頁圖片將自動貼在 A4 下方空位；PDF 或多頁則改為文字勾選提醒。</p>
                
                <label style="border-top: 1px dashed #ccc; padding-top: 12px; margin-top: 5px;">📁 相關文件 - <span style="color: var(--primary-color);">隨公告發布歸檔 (不印在底圖上)</span></label>
                <input type="file" id="related-doc-input">
            </div>
            <!-- 【區塊結束】 -->

            <div class="smart-item-group alert-box">
                <label><input type="checkbox" id="chk-rem1" checked> <b>配合事項：</b>懇請住戶協助配合辦理...</label>
                <label><input type="checkbox" id="chk-rem2" checked> <b>致歉語一：</b>施工期間若造成不便...</label>
                <label><input type="checkbox" id="chk-rem3" checked> <b>致歉語二：</b>測試期間若造成不便...</label>
                <label style="margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 5px;">
                    <input type="checkbox" id="chk-att"> <b>附件：</b>詳見後附之相關文件 (含相片/PDF)
                </label>
            </div>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>中間內容字體微調 (輸入數字)</label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="number" id="zoom-number" min="14" max="80" step="1" value="18" style="width: 80px; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px;">
                    <span style="font-weight: bold; font-size: 14px;">px</span>
                </div>
            </div>

            <button id="print-btn" class="primary-btn">列印 / 存成 PDF</button>
        </div> 
        <!-- 左側控制面板結束 -->

        <!-- 右側預覽面板開始 -->
        <div class="preview-panel">
            <div class="a4-canvas" id="a4-canvas">
                <div class="content-wrapper">
                    <div class="header-section">
                        <div class="title-container">
                            <h1 class="main-title"><span id="preview-title">請輸入標題</span> (<span id="preview-type">公告</span>)</h1>
                        </div>
                        <div class="sub-info">
                            <span>公告日期：<span id="preview-start-date">___年__月__日</span></span>
                            <span>公告截止：<span id="preview-end-date">___年__月__日</span></span>
                            <span>公告字號：<span id="preview-serial">_______________</span></span>
                        </div>
                    </div>
                    
                    <div class="body-section" id="preview-body-section">
                        <div id="preview-content" class="text-content"></div>
                        
                        <div id="preview-attachment-container"></div>
                    </div>

                    <div class="footer-section">
                        <p class="contact-text">任何問題請聯絡管理中心 02-86463220</p>
                        <div class="stamp">東方桂冠<br>管理中心<br>確認章</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 右側預覽面板結束 -->
    </div>
    
    <!-- 載入外部 JS -->
    <script src="script.js"></script>
</body>
</html>
